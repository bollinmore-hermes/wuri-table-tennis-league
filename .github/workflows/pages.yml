name: Deploy GitHub Pages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    env:
      DEPLOYMENT_TARGET: production
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build fail-closed Production Pages artifact
        env:
          SNAPSHOT_SOURCE_TAG: ${{ github.ref_name }}
          SUPABASE_PRODUCTION_URL: ${{ secrets.SUPABASE_PRODUCTION_URL }}
          SUPABASE_PRODUCTION_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PRODUCTION_PUBLISHABLE_KEY }}
        run: npm run build:production-pages
      - name: Verify Production artifact identity
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const config=fs.readFileSync('production-pages-dist/assets/js/config.js','utf8');
          if(!config.includes('"environment": "production"'))throw new Error('Production environment marker missing');
          if(!config.includes('"projectRef": "zofiiibgnjuodgrzhkpn"'))throw new Error('Unexpected Production project ref');
          if(config.includes('vppjcjfbcoxzofcuxmzz'))throw new Error('Test project leaked into Production artifact');
          NODE
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: production-pages-dist
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
