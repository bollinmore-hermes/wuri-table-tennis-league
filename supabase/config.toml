project_id = "wuri-table-tennis-league"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:8765"
additional_redirect_urls = ["http://localhost:8765"]
enable_signup = false

[functions.invite-league-user]
verify_jwt = true

[functions.manage-league-user]
verify_jwt = true

# JWT is verified with Auth getUser in the function; anon keys are never authority.
[functions.publish-public-snapshot]
verify_jwt = false

# Cron-only constant-time secret authentication; browsers and user JWTs are not authority.
[functions.auto-publish-public-snapshot]
verify_jwt = false
