<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>烏日桌球聯賽｜裁判賽後回報</title><link rel="stylesheet" href="assets/css/reporting.css"></head><body><main class="report-shell"><h1>裁判賽後比分回報</h1><p>保留原出場序與紙本計分；僅回報整場最終比分。回報須經賽務核對，尚非正式結果。</p><h2 id="dayTitle">正在確認當日連結…</h2><p id="message" role="status" aria-live="polite"></p><section id="picker"><div class="report-filters"><label>組別<select id="group"><option value="ALL">全部組別</option></select></label><label>隊伍／場次搜尋<input id="search" type="search" maxlength="100" placeholder="隊伍名稱或場次編號"></label></div><div id="matches"></div></section><section id="entry" hidden><h2 id="identity"></h2><p>請核對紙本左右隊伍順序。</p><div class="score-pair"><label><strong id="homeName"></strong><select id="home" aria-label="左隊最終比分"><option value="">—</option><option>0</option><option>1</option><option>2</option><option>3</option></select></label><label><strong id="awayName"></strong><select id="away" aria-label="右隊最終比分"><option value="">—</option><option>0</option><option>1</option><option>2</option><option>3</option></select></label></div><p>合法比分：3–0、0–3、2–1、1–2。</p><div class="report-actions"><button id="submit" type="button">送出回報</button><button id="check" type="button" hidden>查證原請求</button><button id="back" type="button">回到當日賽程</button></div></section></main><script src="assets/js/config.js"></script><script src="assets/vendor/supabase.js"></script><script src="assets/js/reporting-core.js"></script><script src="assets/js/referee.js"></script></body></html>
